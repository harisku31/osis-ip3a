<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divisi OSIS</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background-color: #013cff;
      font-family: "Poppins", sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      gap: 50px;
      position: relative;
    }

    a.back {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 18px;
      text-decoration: none;
      font-weight: 600;
      border: 2px solid white;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      text-shadow: 0 0 6px #fff;
      transition: all 0.3s ease;
    }

    a.back:hover {
      color: #FFD700;
      border-color: #FFD700;
      box-shadow: 0 0 15px #FFD700;
      text-shadow: 0 0 12px #FFD700;
    }

    .main-photo img {
      width: 385px;
      height: auto;
      cursor: pointer;
      transition: 0.4s ease;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 130px);
      gap: 25px;
      justify-content: center;
      max-height: 500px;
      overflow-y: auto;
      padding-right: 5px;
      scrollbar-width: none;
    }

    .grid::-webkit-scrollbar { display: none; }

    .grid-item {
      width: 130px;
      text-align: center;
    }

    .grid-item img {
      width: 120px;
      height:120px;
      object-fit: contain;
      cursor: pointer;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.7));
      transition: 0.3s ease;
      border-radius: 10px;
    }

    .popup {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 999;
      animation: fadeIn 0.3s ease;
    }

    .popup-content {
      background: #001f9a;
      display: flex;
      padding: 25px 35px;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(20,20,0,0.4);
      gap: 25px;
      max-width: 600px;
      color: white;
      position: relative;
      animation: zoomIn 0.3s ease;
    }

    .popup-content img {
      width: 200px;
      border-radius: 12px;
      filter: drop-shadow(0 0 12px #fff);
    }

    .popup-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.7;
      font-size: 16px;
      gap: 8px;
    }

    .edit-btn, .save-btn {
      margin-top: 12px;
      padding: 6px 14px;
      background: #FFD700;
      color: black;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      align-self: flex-start;
    }

    .close-btn {
      position: absolute;
      top: 18px;
      right: 25px;
      font-size: 28px;
      cursor: pointer;
      color: white;
    }
  </style>
</head>
<body>

<a class="back" href="index.html">← Kembali</a>

</div>

    <div class="grid-item">

     <div class="grid-item">

     <div class="grid-item">

         <div class="grid-item">

    <div class="grid-item">

  </div>
</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <span class="close-btn" onclick="closePopup()">×</span>

  <div class="popup-content">
    <img id="popupImg" src="" alt="">

    <div class="popup-text">
      <div><strong>Nama:</strong> <span id="nama">-</span></div>
      <div><strong>Kelas:</strong> <span id="kelas">-</span></div>
      <div><strong></strong> <span id="konsulat"></span></div>

      <div><strong>Divisi:</strong>
        <span id="divisiDisplay">Kesehatan</span>
      </div>

      <button class="edit-btn" onclick="editInfo()">Edit</button>
      <button class="save-btn" onclick="saveInfo()" style="display:none;">Simpan</button>
    </div>
  </div>
</div>

<script>
function openPopup(img) {

  document.getElementById("popupImg").src = img.src;
  document.getElementById("nama").textContent = img.alt;
  document.getElementById("kelas").textContent = img.dataset.kelas;
  document.getElementById("konsulat").textContent = img.dataset.konsulat;

  document.getElementById("popup").style.display = "flex";

  let saved = localStorage.getItem(img.alt);
  if(saved){
    saved = JSON.parse(saved);
    document.getElementById("nama").textContent = saved.nama;
    document.getElementById("kelas").textContent = saved.kelas;
    document.getElementById("konsulat").textContent = saved.konsulat;
  }
}

function closePopup() {
  saveInfo();
  document.getElementById("popup").style.display = "none";
}

function editInfo() {
  document.getElementById("nama").contentEditable = true;
  document.getElementById("kelas").contentEditable = true;
  document.getElementById("konsulat").contentEditable = true;

  document.querySelector(".edit-btn").style.display = "none";
  document.querySelector(".save-btn").style.display = "inline-block";
}

function saveInfo() {

  document.getElementById("nama").contentEditable = false;
  document.getElementById("kelas").contentEditable = false;
  document.getElementById("konsulat").contentEditable = false;

  let person = {
    nama: document.getElementById("nama").textContent,
    kelas: document.getElementById("kelas").textContent,
    konsulat: document.getElementById("konsulat").textContent,
    divisi: "Keamanan",
    img: document.getElementById("popupImg").src
  };

  localStorage.setItem(person.nama, JSON.stringify(person));

  document.querySelector(".save-btn").style.display = "none";
  document.querySelector(".edit-btn").style.display = "inline-block";
}

window.onclick = function(e) {
  const popup = document.getElementById("popup");
  if (e.target === popup) {
    saveInfo();
    popup.style.display = "none";
  }
};
</script>

</body>
</html>
